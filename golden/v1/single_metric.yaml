      WHERE invoice_type = 'sale' AND year(invoice_ts) = 2011
      GROUP BY 1 QUALIFY ROW_NUMBER() OVER (ORDER BY COUNT(*) DESC) = 1
    answer: {values: [orders], entities: [day_name]}

  - id: sm-049
    question: Which month of 2010 had the highest net merchandise revenue, and what was it?
    tags: [revenue, monthly, top-1]
    gold_sql: |
      SELECT revenue_month, net_merchandise_revenue AS net_revenue FROM mart_revenue_monthly
      WHERE year(revenue_month) = 2010 ORDER BY net_revenue DESC LIMIT 1
    alt_sql: |
      SELECT CAST(date_trunc('month', f.invoice_ts) AS DATE) AS revenue_month, SUM(f.line_revenue) AS net_revenue
      FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND f.line_type IN ('sale', 'cancellation') AND year(f.invoice_ts) = 2010
      GROUP BY 1 ORDER BY 2 DESC LIMIT 1
    answer: {values: [net_revenue], entities: [revenue_month]}

  - id: sm-050
    question: What was the month-over-month growth of net merchandise revenue in September 2011?
    tags: [growth, mom]
    gold_sql: |
      SELECT mom_growth FROM mart_revenue_monthly WHERE revenue_month = DATE '2011-09-01'
    alt_sql: |
      WITH m AS (
        SELECT date_trunc('month', f.invoice_ts) AS mth, SUM(f.line_revenue) AS r
        FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
        WHERE p.is_merchandise AND f.line_type IN ('sale', 'cancellation') GROUP BY 1)
      SELECT ROUND((sep.r - aug.r) / aug.r, 4) AS mom_growth FROM m sep, m aug
      WHERE sep.mth = TIMESTAMP '2011-09-01' AND aug.mth = TIMESTAMP '2011-08-01'
    answer: {values: [mom_growth]}

  - id: sm-051
    question: What was the year-over-year growth of net merchandise revenue in November 2011 compared with November 2010?
    tags: [growth, yoy]
    gold_sql: |
      SELECT yoy_growth FROM mart_revenue_monthly WHERE revenue_month = DATE '2011-11-01'
    alt_sql: |
      SELECT ROUND(SUM(CASE WHEN year(revenue_month) = 2011 THEN net_merchandise_revenue END)
             / SUM(CASE WHEN year(revenue_month) = 2010 THEN net_merchandise_revenue END) - 1, 4) AS yoy_growth
      FROM mart_revenue_monthly WHERE month(revenue_month) = 11 AND year(revenue_month) IN (2010, 2011)
    answer: {values: [yoy_growth]}

  - id: sm-052
