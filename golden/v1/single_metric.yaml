  - id: sm-048
    question: Which day of the week had the most orders in 2011, and how many?
    tags: [weekday, orders, top-1]
    gold_sql: |
      SELECT d.day_name, COUNT(DISTINCT f.invoice_id) AS orders
      FROM fct_order_lines f JOIN dim_date d ON f.date_key = d.date_key
      WHERE f.line_type = 'sale' AND d.calendar_year = 2011
      GROUP BY 1 ORDER BY orders DESC LIMIT 1
    alt_sql: |
