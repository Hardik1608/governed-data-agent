      SELECT SUM(f.unit_price) / COUNT(*) AS avg_unit_price FROM fct_order_lines f
      WHERE f.line_type = 'sale' AND f.invoice_ts >= TIMESTAMP '2011-01-01' AND f.invoice_ts < TIMESTAMP '2012-01-01'
        AND f.product_key = (SELECT product_key FROM dim_product WHERE stock_code = '85123A')
    answer: {values: [avg_unit_price]}

