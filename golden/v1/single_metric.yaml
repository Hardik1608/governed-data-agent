  - id: sm-054
    question: What was the average net merchandise revenue per trading day in November 2011 (days with at least one invoice)?
    tags: [revenue, daily]
    gold_sql: |
      SELECT SUM(f.line_revenue) / COUNT(DISTINCT f.date_key) AS revenue_per_day
      FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND f.line_type IN ('sale', 'cancellation')
        AND f.invoice_ts >= TIMESTAMP '2011-11-01' AND f.invoice_ts < TIMESTAMP '2011-12-01'
    alt_sql: |
      SELECT (SELECT net_merchandise_revenue FROM mart_revenue_monthly WHERE revenue_month = DATE '2011-11-01')
             / (SELECT COUNT(DISTINCT date_key) FROM fct_orders WHERE invoice_ts >= TIMESTAMP '2011-11-01'
                AND invoice_ts < TIMESTAMP '2011-12-01') AS revenue_per_day
    answer: {values: [revenue_per_day]}
    note: Both count days with any invoice; every November 2011 trading day has merchandise lines.

