  - id: sm-038
    question: Which product sold the most units in 2010 (sale lines, before cancellations), and how many units?
    tags: [products, top-1, units]
    gold_sql: |
      SELECT p.stock_code, p.product_description, SUM(f.quantity) AS units
      FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND f.line_type = 'sale' AND year(f.invoice_ts) = 2010
      GROUP BY 1, 2 ORDER BY units DESC LIMIT 1
    alt_sql: |
      WITH u AS (
        SELECT product_key, SUM(quantity) AS units FROM fct_order_lines
        WHERE line_type = 'sale' AND invoice_ts >= TIMESTAMP '2010-01-01' AND invoice_ts < TIMESTAMP '2011-01-01'
        GROUP BY product_key)
      SELECT p.stock_code, p.product_description, u.units FROM u JOIN dim_product p ON u.product_key = p.product_key
      WHERE p.is_merchandise QUALIFY ROW_NUMBER() OVER (ORDER BY u.units DESC) = 1
    answer: {values: [units], entities: [{any_of: [stock_code, product_description]}]}

  - id: sm-039
    question: Which product generated the most net merchandise revenue in 2010, and how much?
    tags: [products, top-1, revenue]
    gold_sql: |
      SELECT p.stock_code, p.product_description, SUM(f.line_revenue) AS net_revenue
      FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND f.line_type IN ('sale', 'cancellation') AND year(f.invoice_ts) = 2010
      GROUP BY 1, 2 ORDER BY net_revenue DESC LIMIT 1
    alt_sql: |
      SELECT arg_max(stock_code, r) AS stock_code, arg_max(product_description, r) AS product_description, max(r) AS net_revenue
      FROM (SELECT p.stock_code, p.product_description, SUM(f.line_revenue) AS r
            FROM dim_product p JOIN fct_order_lines f ON f.product_key = p.product_key
            JOIN dim_date d ON f.date_key = d.date_key
            WHERE p.is_merchandise AND f.line_type <> 'stock_write_off' AND f.line_type <> 'bad_debt_adjustment'
              AND d.calendar_year = 2010
            GROUP BY 1, 2)
    answer: {values: [net_revenue], entities: [{any_of: [stock_code, product_description]}]}

