  - id: sm-057
    question: How many merchandise units were cancelled in 2011?
    tags: [cancellations, units]
    gold_sql: |
      SELECT -SUM(f.quantity) AS units_cancelled FROM fct_order_lines f
      JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND f.line_type = 'cancellation' AND year(f.invoice_ts) = 2011
    alt_sql: |
      SELECT SUM(abs(f.quantity)) AS units_cancelled FROM fct_order_lines f
      WHERE f.invoice_id LIKE 'C%' AND f.invoice_ts >= TIMESTAMP '2011-01-01' AND f.invoice_ts < TIMESTAMP '2012-01-01'
        AND f.product_key IN (SELECT product_key FROM dim_product WHERE is_merchandise)
    answer: {values: [units_cancelled]}

  - id: sm-058
    question: What was the 2011 cancellation rate by value, defined as cancelled merchandise value divided by gross merchandise sales?
    tags: [cancellations, rate]
    gold_sql: |
      SELECT -SUM(cancelled_merchandise) / SUM(gross_merchandise_sales) AS cancellation_rate
      FROM mart_revenue_monthly WHERE year(revenue_month) = 2011
    alt_sql: |
      SELECT -SUM(CASE WHEN f.line_type = 'cancellation' THEN f.line_revenue ELSE 0 END)
             / SUM(CASE WHEN f.line_type = 'sale' THEN f.line_revenue ELSE 0 END) AS cancellation_rate
      FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND year(f.invoice_ts) = 2011
    answer: {values: [cancellation_rate]}

  - id: sm-059
    question: How many sale invoices in 2011 had more than 50 lines?
    tags: [orders, basket]
    gold_sql: |
      SELECT COUNT(*) AS big_invoices FROM fct_orders
      WHERE invoice_type = 'sale' AND n_lines > 50 AND year(invoice_ts) = 2011
    alt_sql: |
      SELECT COUNT(*) AS big_invoices FROM (
        SELECT f.invoice_id FROM fct_order_lines f
        WHERE f.invoice_id IN (SELECT invoice_id FROM fct_orders WHERE invoice_type = 'sale')
          AND f.invoice_ts >= TIMESTAMP '2011-01-01' AND f.invoice_ts < TIMESTAMP '2012-01-01'
        GROUP BY f.invoice_id HAVING COUNT(*) > 50)
    answer: {values: [big_invoices]}

  - id: sm-060
    question: What was the average unit price across merchandise sale lines in November 2011 (simple average over lines)?
