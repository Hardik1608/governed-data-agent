  - id: sm-041
    question: What was the average unit price of product 85123A on its sale lines in 2011 (simple average over the lines)?
    tags: [products, price]
    gold_sql: |
      SELECT AVG(f.unit_price) AS avg_unit_price FROM fct_order_lines f
