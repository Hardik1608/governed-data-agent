  - id: sm-037
    question: How many merchandise units were sold in December 2010 (sale lines, before cancellations)?
    tags: [units]
    gold_sql: |
      SELECT SUM(f.quantity) AS units FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      WHERE p.is_merchandise AND f.line_type = 'sale'
        AND f.invoice_ts >= TIMESTAMP '2010-12-01' AND f.invoice_ts < TIMESTAMP '2011-01-01'
    alt_sql: |
