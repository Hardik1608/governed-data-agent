      WHERE o.invoice_type IN ('sale', 'cancellation') AND NOT c.is_domestic_market AND year(o.invoice_ts) = 2011
      GROUP BY 1 QUALIFY RANK() OVER (ORDER BY SUM(o.merchandise_revenue) DESC) = 1
    answer: {values: [net_revenue], entities: [country_name]}

