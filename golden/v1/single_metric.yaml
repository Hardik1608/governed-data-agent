  - id: sm-045
    question: Outside the United Kingdom, which country generated the most net merchandise revenue in 2011, and how much?
    tags: [countries, top-1, revenue]
    gold_sql: |
      SELECT c.country_name, SUM(f.line_revenue) AS net_revenue
      FROM fct_order_lines f JOIN dim_product p ON f.product_key = p.product_key
      JOIN dim_country c ON f.country_key = c.country_key
      WHERE p.is_merchandise AND f.line_type IN ('sale', 'cancellation') AND year(f.invoice_ts) = 2011
        AND c.country_name <> 'United Kingdom'
      GROUP BY 1 ORDER BY net_revenue DESC LIMIT 1
    alt_sql: |
