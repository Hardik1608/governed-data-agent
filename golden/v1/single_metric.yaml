  - id: sm-053
    question: On how many distinct days in November 2011 was at least one invoice recorded?
    tags: [calendar]
    gold_sql: |
      SELECT COUNT(DISTINCT CAST(invoice_ts AS DATE)) AS trading_days FROM fct_order_lines
      WHERE invoice_ts >= TIMESTAMP '2011-11-01' AND invoice_ts < TIMESTAMP '2011-12-01'
    alt_sql: |
      SELECT COUNT(*) AS trading_days FROM dim_date d
